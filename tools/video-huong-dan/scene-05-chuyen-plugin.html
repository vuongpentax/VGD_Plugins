<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Đoạn 5 · Chuyển plugin 2022 ↔ 2024</title>
<link rel="stylesheet" href="common.css"></head><body>
<div id="stage"><div id="world">
 <div class="win dark cwin" id="center"><div class="title"><span>VGD Center</span><span>—&nbsp;&nbsp;☐&nbsp;&nbsp;✕</span></div><iframe id="cf" title="VGD Center"></iframe></div>
 <div id="spot"></div>
</div>
<div class="cap" id="c1"><span>Bước 1</span>Chọn bản SketchUp nguồn và đích</div>
<div class="cap" id="c2"><span>Bước 2</span>Tick các plugin cần chuyển</div>
<div class="cap big" id="c3">Không tick “Ghi đè”: plugin đã có ở bản đích được giữ nguyên</div>
<div class="cap" id="c4"><span>Bước 3</span>Bấm “Chuyển sang bản 2024”</div>
<div class="cap big" id="c5"><span>Lưu ý</span>Đọc kỹ cảnh báo tương thích</div>
<div class="cap" id="c6">Đóng SketchUp và mở lại bản 2024 để áp dụng</div>
<div id="rip"></div>
<svg id="cur" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></svg>
</div>
<script src="common.js"></script><script src="center.js"></script><script>
const DUR=30;let M,Z1,Z2,SC,rSel,TSrc,TDst,TNone,TC1,TC2,TOv,TGo;
// Thông báo kết quả theo mẫu của Center; "TenPlugin" chỉ là ví dụ cho dòng cảnh báo
const OUT='Đã chép: 4 mục.\nCảnh báo tương thích: TenPlugin: có file mã hóa (.rbe), thường chỉ chạy đúng bản Ruby mà nó được mã hóa cho; nếu lỗi hãy cài lại bản dành cho SketchUp đích\nHãy đóng SketchUp và mở lại bản 2024 để áp dụng.';
const pl=n=>[...W.document.querySelectorAll('#mgrMlist .mgr-pl')].find(c=>c.value===n);
window.CENTER_READY=mountCenter('cf','manager');
async function init(){
 W.VGD.receiveState(centerState({}));mgrOpen('toggle');mgrState({});W.VGDManager.initMigrate(['2022','2024']);W.VGDManager.renderMigrate({src:'2022',dst:'2024',plugins:MGR_NAMES});
 W.document.getElementById('mgr-tab-migrate').click();SC=contentTop('.mgr-tabs')-10;mgrScroll(SC);
 rSel=RC('.mgr-ver-row');TSrc=aim(RC('#mgrSrc'),.6);TDst=aim(RC('#mgrDst'),.6);TNone=aim(RC('#mgrSetNone'),.7);
 TC1=aim(RC(pl('vgd_dim')),.5);TC2=aim(RC(pl('vgd_scenes')),.5);TOv=aim(RC('#mgrOverwrite'),.5);TGo=aim(RC('#mgrGo'),.72);
 const ov=RC('.mgr-opt');
 W.VGDManager.showResult(OUT);const mo=RC('#mgrOut');W.VGDManager.showResult('');
 Z1=fitZoom(RC('.mgr-ver-row'),1.6,640,380);Z2=fitZoom(mo,1.6,640,370);
 M=[{a:.8,b:2.0,f:{x:1010,y:690},t:TSrc,arc:-80},{a:2.8,b:3.6,f:TSrc,t:TDst,arc:-20},{a:4.6,b:5.8,f:TDst,t:TNone,arc:30},{a:6.6,b:7.8,f:TNone,t:TC1,arc:-30},{a:8.6,b:9.4,f:TC1,t:TC2,arc:-20},
    {a:10.4,b:11.4,f:TC2,t:TOv,arc:30},{a:17.2,b:19.2,f:TOv,t:TGo,arc:-40},{a:21.6,b:22.4,f:TGo,t:{x:300,y:520},arc:30}];
 render(0)}
function render(t){
 const zA=E(P(t,10.6,11.4))*(1-E(P(t,17.0,17.8))),zB=E(P(t,21.4,22.2))*(1-E(P(t,27.4,28.2)));
 const c=mix(mix({s:1,x:0,y:0},Z1,zA),Z2,zB);setWorld(c);
 W.VGD.receiveState(centerState({}));W.document.getElementById('mgr-tab-migrate').click();
 // dấu chọn: tất cả → bỏ hết (5.6) → tick vgd_dim (8.0) và vgd_scenes (9.6)
 for(const n of MGR_NAMES){const cb=pl(n);cb.checked=t<5.6||(n==='vgd_dim'&&t>=8.0)||(n==='vgd_scenes'&&t>=9.6);cb.dispatchEvent(new W.Event('change'))}
 W.VGDManager.showResult(t>=20.6?OUT:'');mgrScroll(SC);W.VGD.setStatus('');
 const go=W.document.getElementById('mgrGo'),nn=W.document.getElementById('mgrSetNone');
 nn.classList.toggle('fx-hover',t>=5.8&&t<6.2);nn.style.transform=`scale(${1-.06*pulse(t,5.45,5.8)})`;
 go.classList.toggle('fx-hover',t>=19.2&&t<20.3);go.style.transform=`scale(${1-.06*pulse(t,20.0,20.35)})`;
 pl('vgd_dim').style.transform=`scale(${1-.25*pulse(t,7.85,8.2)})`;pl('vgd_scenes').style.transform=`scale(${1-.25*pulse(t,9.45,9.8)})`;
 // làm tối nền, làm nổi cặp ô chọn phiên bản (đầu) và nút Chuyển (khi bấm)
 const rg=RC('#mgrGo'),k1=E(P(t,1.0,1.5))*(1-E(P(t,4.0,4.4))),k2=E(P(t,18.6,19.2))*(1-E(P(t,20.2,20.5)));
 const rr=k1>=k2?rSel:rg,s=$('spot');s.style.cssText+=`;opacity:${Math.max(k1,k2)};left:${rr.x-4}px;top:${rr.y-4}px;width:${rr.w+8}px;height:${rr.h+8}px`;
 W.document.querySelector('.mgr-opt').style.outline=t>11.4&&t<17?'2px solid #B48963':'none';
 const press=pulse(t,5.45,5.8)||pulse(t,7.85,8.2)||pulse(t,9.45,9.8)||pulse(t,20.0,20.35),rp_=a=>P(t,a,a+.45);
 drawCursor(c,pos(M,t),t,.6,29.5,press,Math.max(rp_(5.45)*(t<7),rp_(7.85)*(t>7&&t<9),rp_(9.45)*(t>9&&t<11),rp_(20.0)*(t>19.5&&t<22)));
 cap($('c1'),t,.9,4.4,0);cap($('c2'),t,5.0,10.4,0);cap($('c3'),t,11.0,17.0,0);cap($('c4'),t,17.4,20.4,0);cap($('c5'),t,21.8,27.2,0);cap($('c6'),t,28.2,29.6,0);
 for(const q of [1,2,4,6])$('c'+q).style.top='640px';$('c3').style.top=$('c5').style.top='38px';
 $('stage').style.opacity=1-E(P(t,29.7,30))}
start();
</script></body></html>
