<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Reference · Lưu ý</title>
<link rel="stylesheet" href="../common.css"><style>
#vp{position:absolute;left:40px;top:40px;width:760px;height:640px;border:1px solid #444;border-radius:8px;overflow:hidden;background:linear-gradient(#1c2128,#14181d);box-shadow:0 24px 60px #000a}
#vp::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:48px 48px}
#vp .lbl{position:absolute;left:14px;top:10px;font-size:11px;color:#8d96a3;letter-spacing:.06em}
.rimg{position:absolute;background-size:cover;background-position:center;border:2px solid #ffffff33;border-radius:2px;opacity:0}
#panel{left:820px;top:20px;width:312px;height:487px;transform:scale(1.4);transform-origin:0 0}#panel .title{height:30px}#panel iframe{display:block;width:310px;height:455px;border:0}
/* Hộp mở file gốc của Windows (không phải HTML của plugin) */
#od{position:absolute;left:190px;top:200px;width:480px;background:#fff;color:#000;border:1px solid #7a7a7a;box-shadow:0 16px 50px #000b;font-family:'Segoe UI',M,sans-serif;opacity:0;font-size:13px;z-index:6}
#od .mt{height:30px;display:flex;align-items:center;padding:0 10px;font-size:12px;border-bottom:1px solid #e5e5e5}#od .bd2{padding:12px 16px}
#od .ls div{padding:5px 8px}#od .ls .sel{background:#cce8ff}#od .mf{background:#f0f0f0;padding:12px 14px;display:flex;justify-content:flex-end;gap:8px}
#od .mbtn{min-width:84px;height:28px;border:1px solid #adadad;background:#e1e1e1;display:grid;place-items:center;font-size:12px}
</style></head><body>
<div id="stage"><div id="world">
 <div id="vp"><span class="lbl">KHUNG NHÌN SKETCHUP (MINH HỌA)</span><div class="rimg" id="ra" style="left:70px;top:90px;width:380px;height:214px;background-image:url(../samples/sofa.svg)"></div><div class="rimg" id="rb" style="left:430px;top:300px;width:260px;height:260px;background-image:url(../samples/cay.svg)"></div></div>
 <div class="win dark" id="panel"><div class="title"><span>VGD Reference | Ảnh tham chiếu</span><span>—&nbsp;&nbsp;✕</span></div><iframe id="cf" title="VGD Reference"></iframe></div>
 <div id="spot"></div>
 <div class="cap" id="c1">Ảnh hiển thị trong lớp phủ theo màn hình</div>
<div class="cap" id="c2">Không tạo hình học và không lưu vào model</div>
<div class="cap" id="c3"><span>Lưu ý</span>Đóng hoặc chuyển model sẽ xóa danh sách ảnh</div>
<div class="cap" id="c4">VGD Reference yêu cầu SketchUp 2023 trở lên trên Windows</div>
</div>
<script src="../common.js"></script><script src="ref.js"></script><script>
const DUR=15;let rVp,rPanel;
window.CENTER_READY=mountReference('cf');
const A={id:1,name:'phoi_canh.jpg',width:1600,height:900,sample:'sofa',visible:true,locked:false,opacity:100},B={id:2,name:'cay_tham_khao.png',width:1000,height:1000,sample:'cay',visible:true,locked:false,opacity:100};
async function init(){
 await refApply({items:[{...A,selected:false},{...B,selected:true}],selected_id:2,hidden_all:false,message:'',confirm:false});
 rVp=R($('vp'));rPanel=R($('panel'));await render(0)}
async function render(t){
 const gone=t>=10.0;
 await refApply({items:gone?[]:[{...A,selected:false},{...B,selected:true}],selected_id:gone?null:2,hidden_all:false,message:'',confirm:false});
 for(const id of ['ra','rb']){const el=$(id);el.style.opacity=gone?0:1;el.style.borderColor=id==='rb'?'#B48963':'#ffffff33'}
 const sp=$('spot');let rr=null,o=0;
 if(t<4.0){rr=rVp;o=E(P(t,1.2,1.7))*(1-E(P(t,3.6,4.0)))}else if(t<7.6){rr=rVp;o=E(P(t,4.4,4.9))*(1-E(P(t,7.0,7.4)))}else if(t<11){rr=rPanel;o=E(P(t,7.8,8.3))*(1-E(P(t,10.6,11.0)))}
 if(rr)sp.style.cssText+=`;opacity:${o};left:${rr.x-4}px;top:${rr.y-4}px;width:${rr.w+8}px;height:${rr.h+8}px`;else sp.style.opacity=0;
 cap($('c1'),t,.9,4.0,0);cap($('c2'),t,4.2,7.4,0);cap($('c3'),t,7.6,11.0,0);cap($('c4'),t,11.4,14.4,0);
 for(const k of [1,2,3,4])$('c'+k).style.top='640px';
 $('stage').style.opacity=1-E(P(t,14.7,15))}
start();
</script></body></html>
