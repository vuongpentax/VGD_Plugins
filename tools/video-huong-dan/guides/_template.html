<!doctype html><html lang="vi" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hướng dẫn</title>
<style>
@font-face{font-family:M;src:url(../../shared/vgd-theme/fonts/manrope-latin-wght-normal.woff2);font-weight:200 800;unicode-range:U+0000-00FF}
@font-face{font-family:M;src:url(../../shared/vgd-theme/fonts/manrope-vietnamese-wght-normal.woff2);font-weight:200 800;unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+1EA0-1EF9}
:root{color-scheme:dark;--bg:#121212;--surface:#1e1e1e;--raised:#2b2b2b;--line:#3a3a3a;--text:#e2e8f0;--muted:#a7b0bd;--accent:#b48963;--accent2:#c8a98a;--tint:#372c24;--on:#121212}
[data-theme=light]{color-scheme:light;--bg:#f7f7f5;--surface:#fff;--raised:#f0eee9;--line:#dedad4;--text:#222;--muted:#6f6f6f;--accent:#94704f;--accent2:#755638;--tint:#f3ece5;--on:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 M,'Segoe UI',Arial,sans-serif}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px max(20px,calc((100% - 1040px)/2));background:var(--raised);border-bottom:1px solid var(--line)}
.brand{font-weight:750;letter-spacing:.08em;font-size:13px}button{font:inherit;cursor:pointer}
.tool{padding:6px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--text)}
main{max-width:1040px;margin:auto;padding:20px 22px 40px}.eyebrow{color:var(--accent2);font-size:10px;font-weight:750;letter-spacing:.15em;text-transform:uppercase}
h1{margin:2px 0;font-size:28px}.lead{color:var(--muted);font-size:15px;margin:0 0 16px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}@media(max-width:760px){.layout{grid-template-columns:1fr}}
.tabs{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tab{width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}
.tab b{display:block;font-size:13.5px}.tab span{display:block;font-size:11.5px;color:var(--muted)}
.tab[aria-selected=true]{border-color:var(--accent);background:var(--tint)}.tab:hover{border-color:var(--accent)}
.tab:focus-visible,.tool:focus-visible,.again:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#player{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#0b0b0b}
#player iframe{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;transform-origin:0 0}
#hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;color:var(--muted);font-size:13px}
.again{padding:6px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--text)}
footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
</style></head><body>
<header class="bar"><div class="brand">VGD · HƯỚNG DẪN</div><button class="tool" id="theme" type="button">Sáng / Tối</button></header>
<main>
<div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1>
<p class="lead" id="lead"></p>
<div class="layout"><ul class="tabs" id="tabs" role="tablist"></ul>
<div><div id="player"><div id="hint">Chọn một phần ở bên cạnh để bắt đầu xem.</div></div>
<div class="row"><span id="now"></span><button class="again" id="again" type="button" hidden>Phát lại từ đầu</button></div></div></div>
<footer id="note"></footer>
</main>
<script>
// Mỗi chương là một trang hoạt ảnh trong tools/video-huong-dan (đã được dựng cùng thư mục khi đăng lên Pages).
// Nội dung trang lấy từ chapters.json cùng thư mục: {title, eyebrow, lead, note, chapters:[{scene, title, duration}]}.
let CH=[];
const $=id=>document.getElementById(id),player=$('player');let cur=-1,frame=null;
function fit(){if(frame)frame.style.transform=`scale(${player.clientWidth/1280})`}
function open(i){cur=i;[...document.querySelectorAll('.tab')].forEach((b,k)=>b.setAttribute('aria-selected',k===i));
 if(frame)frame.remove();$('hint').hidden=true;frame=document.createElement('iframe');frame.title=CH[i][1];frame.setAttribute('sandbox','allow-scripts allow-same-origin');
 frame.src='../../tools/video-huong-dan/'+CH[i][0]+'.html?play';player.appendChild(frame);fit();$('now').textContent=`${i+1}. ${CH[i][1]}`;$('again').hidden=false;
 try{history.replaceState(null,'','?bai='+(i+1))}catch(_){}}
$('again').onclick=()=>{if(cur>=0)open(cur)};
$('theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'};
addEventListener('resize',fit);
fetch('chapters.json').then(r=>r.json()).then(d=>{CH=d.chapters.map(c=>[c.scene,c.title,c.duration]);document.title='Hướng dẫn · '+d.title;
 $('eyebrow').textContent=d.eyebrow;$('title').textContent=d.title;$('lead').textContent=d.lead;$('note').textContent=d.note||'';
CH.forEach((c,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.className='tab';b.setAttribute('role','tab');b.setAttribute('aria-selected','false');
  b.innerHTML=`<b>${i+1}. ${c[1]}</b><span>${c[2]}</span>`;b.onclick=()=>open(i);li.appendChild(b);$('tabs').appendChild(li)});
 
 const q=parseInt(new URLSearchParams(location.search).get('bai'),10);if(q>=1&&q<=CH.length)open(q-1)});
</script></body></html>
