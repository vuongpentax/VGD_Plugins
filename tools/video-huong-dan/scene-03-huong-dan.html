<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Đoạn 3 · Mở Hướng dẫn</title>
<link rel="stylesheet" href="common.css"><style>
#center{left:20px;top:40px;width:860px;height:640px}
#guideWin{left:380px;top:60px;width:860px;height:620px;opacity:0}#guideWin iframe{display:block;width:858px;height:588px;border:0}
</style></head><body>
<div id="stage"><div id="world">
 <div class="win dark cwin" id="center"><div class="title"><span>VGD Center</span><span>—&nbsp;&nbsp;☐&nbsp;&nbsp;✕</span></div><iframe id="cf" title="VGD Center"></iframe></div>
 <div id="spot"></div>
 <div class="win dark" id="guideWin"><div class="title"><span>Hướng dẫn · VGD Dim</span><span>—&nbsp;&nbsp;☐&nbsp;&nbsp;✕</span></div><iframe id="gf" title="Hướng dẫn VGD Dim"></iframe></div>
</div>
<div class="cap" id="c1"><span>Bước 1</span>Bấm “Hướng dẫn” trên thẻ plugin</div>
<div class="cap" id="c2"><span>Bước 2</span>Trang hướng dẫn mở trong cửa sổ riêng</div>
<div class="cap big" id="c3"><span>Bước 3</span>Đổi Sáng / Tối, hoặc In / Lưu PDF</div>
<div class="cap" id="c4">Hướng dẫn luôn mới nhất khi có mạng</div>
<div id="rip"></div>
<svg id="cur" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></svg>
</div>
<script src="common.js"></script><script>
const DUR=15,BTN='#catalogGrid [data-action=open_guide][data-id=dim]';
let M,Z,rCard,T1,T2,T3,GW;
window.CENTER_READY=mountCenter('cf','catalog');
async function init(){
 W.VGD.receiveState(centerState({}));
 const gf=$('gf');await new Promise(res=>{gf.onload=res;gf.src=CENTER_DIR+'guides/dim.html'});GW=gf.contentWindow;await sleep(300);
 const st=GW.document.createElement('style');st.textContent='*{transition:none!important;animation:none!important}';GW.document.head.appendChild(st);
 rCard=RC(W.document.querySelector(BTN).closest('article'));
 const bt=RC(GW.document.querySelector('.tools button:nth-child(1)'),'gf'),bp=RC(GW.document.querySelector('.tools button:nth-child(2)'),'gf');
 T1=aim(RC(BTN),.72);T2=aim(bt,.78);T3=aim(bp,.78);
 Z=zoomTo((bt.x+bp.x+bp.w)/2,bt.y+bt.h/2,1.9,760,330);
 M=[{a:.8,b:2.4,f:{x:1010,y:690},t:T1,arc:-90},{a:4.7,b:5.7,f:T1,t:{x:930,y:430},arc:50},{a:8.5,b:9.8,f:{x:930,y:430},t:T2,arc:40},{a:11.3,b:12.1,f:T2,t:T3,arc:20}];
 render(0)}
function render(t){
 const c=mix({s:1,x:0,y:0},Z,E(P(t,8.0,8.9))*(1-E(P(t,12.8,13.7))));setWorld(c);
 const open=E(P(t,3.9,4.4));$('center').style.filter=`brightness(${1-.3*open})`;
 // làm tối nền, làm nổi thẻ plugin (mẫu 2); tắt khi cửa sổ mở
 const sp=E(P(t,1.2,1.8))*(1-E(P(t,3.7,4.1))),s=$('spot');
 s.style.cssText+=`;opacity:${sp};left:${rCard.x-4}px;top:${rCard.y-4}px;width:${rCard.w+8}px;height:${rCard.h+8}px`;
 hover(BTN,t>=2.4&&t<4.0);const b=W.document.querySelector(BTN);b.style.transform=`scale(${1-.06*pulse(t,3.5,3.85)})`;
 const g=$('guideWin');g.style.opacity=open;g.style.transform=`translateY(${(1-open)*14}px) scale(${.96+.04*open})`;
 // trang hướng dẫn: nút Sáng / Tối đổi theme (10.3)
 GW.document.documentElement.dataset.theme=t>=10.3?'light':'dark';
 const bs=GW.document.querySelector('.tools button:nth-child(1)'),bpr=GW.document.querySelector('.tools button:nth-child(2)');
 bs.style.transform=`scale(${1-.06*pulse(t,10.2,10.5)})`;bs.style.borderColor=t>9.8&&t<11.3?'var(--accent)':'';bpr.style.borderColor=t>12.1&&t<12.9?'var(--accent)':'';
 const rp_=a=>P(t,a,a+.45);
 drawCursor(c,pos(M,t),t,.6,14.6,pulse(t,3.5,3.85)||pulse(t,10.2,10.5),Math.max(rp_(3.5)*(t<5),rp_(10.2)*(t>9&&t<11)));
 cap($('c1'),t,.9,3.8,0);cap($('c2'),t,4.7,7.8,0);cap($('c3'),t,8.3,12.8,0);cap($('c4'),t,13.7,14.9,0);
 for(const k of [1,2,4])$('c'+k).style.top='640px';$('c3').style.top='70px';
 $('stage').style.opacity=1-E(P(t,14.7,15))}
start();
</script></body></html>
