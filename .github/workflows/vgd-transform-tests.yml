# Chạy test của VGD Transform (Ruby, quy ước repo, giao diện Playwright) khi có thay đổi trong plugin hoặc test chung.
# Chưa thay thế kiểm tra trong SketchUp thật: xem VALIDATION.md của plugin.
name: Test VGD Transform

on:
  push:
    paths:
      - 'plugins/VGD_Transform/**'
      - 'tests/**'
      - 'tools/sync_vgd_theme.py'
      - '.github/workflows/vgd-transform-tests.yml'
  pull_request:
    paths:
      - 'plugins/VGD_Transform/**'
      - 'tests/**'
      - 'tools/sync_vgd_theme.py'
      - '.github/workflows/vgd-transform-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby:
    name: Test Ruby và quy ước repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Test VGD Transform (cú pháp, logic, dời, tải lại)
        working-directory: plugins/VGD_Transform
        run: ruby dev/run_tests.rb
      - name: Test quy ước đặt tên và menu
        run: ruby tests/test_vgd_conventions.rb

  giao-dien:
    name: Test giao diện (Playwright)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_VERSION: '1.63.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cài Playwright và trình duyệt
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" "playwright@$PLAYWRIGHT_VERSION"
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Chạy test giao diện
        working-directory: plugins/VGD_Transform
        env:
          VGD_PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
        run: node dev/test_ui.cjs
