<!doctype html>
<!-- Bản mẫu giao diện cửa sổ Đổi tên độc lập của VGD BIM (chưa nối Ruby, dữ liệu giả). Bố cục theo trang mẫu chủ dự án gửi, bỏ N1 N2 N3,
     viết bằng JS thuần và token theme VGD (không dùng Vue). Mở trực tiếp bằng trình duyệt để xem. Khi chốt sẽ chuyển thành runtime/vgd_bim/html/rename.html. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VGD BIM · Đổi tên</title>
<link rel="stylesheet" href="../runtime/vgd_bim/html/vgd-theme/vgd-theme.css">
<link rel="stylesheet" href="../runtime/vgd_bim/html/vgd-theme/vgd-controls.css">
<style>
  :root { --row-h: 26px; --head-h: 28px; --line: var(--vgd-border); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button, input { font: inherit; color: inherit; }

  /* ---- Thanh tiêu đề nhỏ ---- */
  .rn-top { flex: none; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; background: var(--vgd-surface); border-top: 3px solid var(--vgd-accent); border-bottom: 1px solid var(--line); }
  .rn-title { font-weight: 700; }
  .rn-scope { color: var(--vgd-muted); font-size: 12px; }
  .rn-top .rn-icon { margin-left: auto; }
  .rn-icon { width: 26px; height: 26px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--vgd-muted); cursor: pointer; display: grid; place-items: center; }
  .rn-icon:hover { background: var(--vgd-elevated); color: var(--vgd-text); }
  .rn-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- Bảng tên ---- */
  .rn-list { flex: 1 1 0; min-height: 120px; display: flex; flex-direction: column; background: var(--vgd-surface); }
  .rn-head, .rn-row { flex: none; display: flex; align-items: center; border-bottom: 0.5px solid var(--line); }
  .rn-head { height: var(--head-h); background: var(--vgd-elevated); font-weight: 600; font-size: 12px; user-select: none; }
  .rn-row { height: var(--row-h); font-size: 12px; cursor: default; }
  .rn-row:hover { background: var(--vgd-tint); }
  .rn-row.sel, .rn-row.sel:hover { background: color-mix(in srgb, var(--vgd-accent) 22%, var(--vgd-surface)); }
  .c-id { flex: none; width: 40px; text-align: center; color: var(--vgd-muted); }
  .c-name, .c-new { flex: 1 1 50%; min-width: 0; height: 100%; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-left: 0.5px solid var(--line); }
  .rn-head .c-name, .rn-head .c-new { cursor: pointer; }
  .sort { font-size: 9px; color: var(--vgd-muted); }
  .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph { color: var(--vgd-muted); font-style: italic; }
  .cnt { flex: none; color: var(--vgd-muted); font-size: 11px; }
  .fold { flex: none; width: 14px; color: var(--vgd-muted); cursor: pointer; text-align: center; transition: transform 150ms var(--vgd-ease); }
  .fold.open { transform: rotate(90deg); }
  .kid .c-name { padding-left: 30px; }
  .new { font-weight: 600; color: var(--vgd-accent-strong); }
  .same { color: var(--vgd-muted); }
  .bad { color: var(--vgd-danger); }
  .num { opacity: .55; }
  .copy { display: none; margin-left: auto; flex: none; width: 14px; height: 14px; color: var(--vgd-muted); cursor: pointer; }
  .c-name:hover .copy { display: block; }
  .copy svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hbtns { margin-left: auto; display: flex; gap: 4px; }
  .hbtn { height: 18px; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--vgd-surface); color: var(--vgd-muted); font-size: 10px; font-weight: 700; cursor: pointer; transition: background 150ms ease, color 150ms ease; }
  .hbtn[aria-pressed="true"] { background: var(--vgd-accent); border-color: var(--vgd-accent); color: var(--vgd-on-accent); }
  .rn-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .rn-row input.edit { width: 100%; height: 100%; border: 0; background: transparent; font-weight: 600; outline: none; }
  .rn-empty { padding: 24px; text-align: center; color: var(--vgd-muted); }

  /* ---- Chân bảng: Thay / Bằng, Tự động, Áp dụng ---- */
  .rn-foot { flex: none; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 6px 10px; flex-wrap: wrap; background: var(--vgd-elevated); border-top: 0.5px solid var(--line); }
  .swap { flex: 1 1 260px; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .swap input { flex: 1 1 0; min-width: 0; height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--vgd-surface); outline: none; }
  .swap input:focus { border-color: var(--vgd-accent); }
  .swap .arrow { flex: none; color: var(--vgd-muted); }
  .auto { flex: none; display: flex; align-items: center; gap: 12px; }
  .auto-title { font-size: 12px; font-weight: 600; }
  .apply { flex: none; min-width: 120px; height: 30px; padding: 0 14px; border: 1px solid var(--vgd-accent); border-radius: 15px; background: var(--vgd-accent); color: var(--vgd-on-accent); font-weight: 700; cursor: pointer; }
  .apply:disabled { opacity: .45; cursor: default; }

  /* ---- Thanh kéo chia đôi ---- */
  .rn-split { flex: none; height: 6px; cursor: row-resize; background: var(--vgd-bg); border-top: 0.5px solid var(--line); border-bottom: 0.5px solid var(--line); }
  .rn-split:hover, body.resizing .rn-split { background: var(--vgd-tint); }
  body.resizing, body.resizing * { cursor: row-resize !important; user-select: none; }

  /* ---- Các danh sách tên để ghép ---- */
  .rn-sets { flex: none; height: 210px; display: flex; min-height: 90px; background: var(--vgd-bg); }
  .set { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; padding: 8px; border-left: 0.5px solid var(--line); }
  .set:first-child { border-left: 0; }
  .set-title { flex: none; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; font-weight: 700; }
  .set-title .cnt { font-weight: 400; }
  .set-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; }
  .chip { position: relative; display: inline-flex; align-items: center; max-width: 100%; height: 24px; padding: 0 22px 0 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--vgd-surface); font-size: 12px; cursor: pointer; transition: border-color 150ms ease, background 150ms ease; }
  .chip:hover { border-color: var(--vgd-accent); }
  .chip.on { background: var(--vgd-tint); border-color: var(--vgd-accent); }
  .chip .txt { max-width: 160px; }
  .chip .x { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); border: 0; padding: 0; background: transparent; color: var(--vgd-muted); cursor: pointer; font-size: 13px; line-height: 1; }
  .chip .x:hover { color: var(--vgd-danger); }
  .set-empty { color: var(--vgd-muted); font-size: 12px; margin: auto; }
  .entry { flex: none; display: flex; align-items: center; gap: 4px; height: 26px; margin-top: 6px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--vgd-surface); }
  .entry:focus-within { border-color: var(--vgd-accent); }
  .entry input { flex: 1 1 auto; min-width: 0; height: 100%; border: 0; background: transparent; outline: none; font-size: 12px; }
  .entry button { border: 0; background: transparent; color: var(--vgd-muted); cursor: pointer; font-size: 15px; padding: 0 2px; }
  .entry button:hover { color: var(--vgd-text); }

  .rn-status { flex: none; height: 24px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; color: var(--vgd-muted); background: var(--vgd-surface); border-top: 0.5px solid var(--line); }
  .tip { position: fixed; z-index: 50; padding: 3px 7px; border-radius: 4px; background: rgba(0,0,0,.82); color: #fff; font-size: 11px; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body class="vgd-ui">
  <div class="rn-top">
    <span class="rn-title">Đổi tên</span>
    <span class="rn-scope" id="scope">12 món đang chọn trong SketchUp</span>
    <button class="rn-icon" id="theme" type="button" aria-label="Đổi giao diện sáng / tối" title="Đổi giao diện sáng / tối"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>

  <div class="rn-list">
    <div class="rn-head">
      <span class="c-id">#</span>
      <span class="c-name" data-sort="name">Tên hiện tại <span class="sort" id="sort-name"></span></span>
      <span class="c-new" data-sort="new">Tên mới <span class="sort" id="sort-new"></span>
        <span class="hbtns">
          <button class="hbtn" id="upper" type="button" aria-pressed="false" title="Viết CHỮ HOA cho tên mới">AA</button>
          <button class="hbtn" id="numbered" type="button" aria-pressed="true" title="Thêm số thứ tự vào cuối tên mới (01, 02...) khi nhiều món cùng tên">123</button>
        </span>
      </span>
    </div>
    <div class="rn-scroll" id="rows"></div>
    <div class="rn-foot">
      <div class="swap">
        <input id="find" type="text" placeholder="Thay" spellcheck="false" autocomplete="off" aria-label="Chữ cần thay">
        <span class="arrow">→</span>
        <input id="repl" type="text" placeholder="Bằng" spellcheck="false" autocomplete="off" aria-label="Thay bằng">
      </div>
      <div class="auto">
        <span class="auto-title">Tự động:</span>
        <span class="vgd-switch-item"><button class="vgd-switch" id="auto-hide" role="switch" aria-checked="false" aria-label="Ẩn món đã đổi tên"></button><span class="vgd-switch-label">Ẩn</span></span>
        <span class="vgd-switch-item"><button class="vgd-switch" id="auto-tag" role="switch" aria-checked="false" aria-label="Gắn nhãn"></button><span class="vgd-switch-label">Gắn nhãn</span></span>
      </div>
      <button class="apply" id="apply" type="button">Áp dụng</button>
    </div>
  </div>

  <div class="rn-split" id="split" title="Kéo để đổi chiều cao"></div>

  <div class="rn-sets" id="sets"></div>
  <div class="rn-status" id="status">Chọn dòng ở trên, rồi bấm một tên ở dưới để ghép vào tên mới. Nhấp đúp ô Tên mới để sửa tay.</div>

<script src="../runtime/vgd_bim/html/vgd-theme/vgd-theme.js"></script>
<script>
'use strict';
// ---- Dữ liệu giả để xem giao diện ----
const SETS = [
  {key: 'kind', title: 'Loại món', items: ['Tủ bếp trên', 'Tủ bếp dưới', 'Tủ áo', 'Kệ tivi', 'Bàn ăn', 'Ghế', 'Giường', 'Cửa đi']},
  {key: 'place', title: 'Vị trí', items: ['Phòng khách', 'Bếp', 'Phòng ngủ 1', 'Phòng ngủ 2', 'WC']},
  {key: 'detail', title: 'Chi tiết', items: ['Cánh', 'Hộc kéo', 'Mặt đá', 'Tay nắm', 'Chân']}
];
const ROWS = [
  {id: 1, name: 'Group#12', group: 'Tủ bếp', n: 3, kids: [{id: 11, name: 'Group#12'}, {id: 12, name: 'Group#12'}, {id: 13, name: 'Group#12'}]},
  {id: 2, name: 'Component#4', newName: 'Kệ tivi'},
  {id: 3, name: ''},
  {id: 4, name: 'Ban an 1m6'},
  {id: 5, name: 'Ghế gỗ', newName: 'Ghế gỗ'},
  {id: 6, name: 'Giuong 1m8', newName: 'Giường'},
  {id: 7, name: 'Cửa D1'},
  {id: 8, name: 'Tu ao 4 canh'}
];
const state = {sel: new Set(), open: new Set([1]), sort: null, desc: false, upper: false, numbered: true, edit: null, last: null};

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };

function flat() {
  const out = [];
  ROWS.forEach(r => { out.push(r); if (r.kids && state.open.has(r.id)) r.kids.forEach(k => out.push(Object.assign(k, {kid: true, parent: r}))); });
  return out;
}
function finalName(r) {
  let text = (r.newName || '').trim();
  const find = $('find').value;
  if (find) text = (text || r.name).split(find).join($('repl').value);
  if (state.upper) text = text.toUpperCase();
  return text;
}
// Số thứ tự khi nhiều món cùng tên mới.
function numbers() {
  const seen = {}, out = {};
  flat().forEach(r => { if (r.kids) return; const n = finalName(r); if (!n) return; seen[n] = (seen[n] || 0) + 1; out[r.id] = seen[n]; });
  const total = {}; Object.keys(out).forEach(id => { const r = flat().find(x => String(x.id) === id); const n = finalName(r); total[n] = (total[n] || 0) + 1; });
  return {out, total};
}
function render() {
  const host = $('rows'); host.replaceChildren();
  const {out, total} = numbers();
  let list = flat();
  if ($('auto-hide').getAttribute('aria-checked') === 'true') list = list.filter(r => !(finalName(r) && finalName(r) === r.name));
  list.forEach(r => {
    const row = el('div', 'rn-row' + (state.sel.has(r.id) ? ' sel' : '') + (r.kid ? ' kid' : ''));
    row.append(el('span', 'c-id', r.kid ? '' : String(r.id)));
    const name = el('span', 'c-name');
    if (r.kids) { const f = el('span', 'fold' + (state.open.has(r.id) ? ' open' : ''), '›'); f.onclick = e => { e.stopPropagation(); state.open.has(r.id) ? state.open.delete(r.id) : state.open.add(r.id); render(); }; name.append(f); }
    name.append(el('span', 'txt' + (r.name ? '' : ' ph'), r.kids ? r.group : (r.name || 'Chưa đặt tên')));
    if (r.kids) name.append(el('span', 'cnt', String(r.n)));
    if (r.name) { const c = el('span', 'copy'); c.title = 'Chép tên này'; c.innerHTML = '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>'; name.append(c); }
    const neu = el('span', 'c-new');
    if (state.edit === r.id) {
      const input = el('input', 'edit'); input.value = r.newName || ''; input.placeholder = r.name || 'Nhập tên mới';
      input.onkeydown = e => { if (e.key === 'Enter') { r.newName = input.value; state.edit = null; render(); } if (e.key === 'Escape') { state.edit = null; render(); } };
      input.onblur = () => { r.newName = input.value; state.edit = null; render(); };
      neu.append(input); setTimeout(() => input.focus(), 0);
    } else if (!r.kids) {
      const text = finalName(r);
      if (text) {
        const same = text === r.name;
        const span = el('span', 'txt ' + (same ? 'same' : 'new'), text);
        if (state.numbered && total[text] > 1) span.append(el('span', 'num', ' ' + String(out[r.id]).padStart(2, '0')));
        neu.append(span);
      }
    }
    row.append(name, neu);
    row.onclick = e => pick(r, e);
    row.ondblclick = () => { if (!r.kids) { state.edit = r.id; render(); } };
    host.append(row);
  });
  if (!list.length) host.append(el('div', 'rn-empty', 'Chọn group hoặc component trong SketchUp để đổi tên.'));
  const changed = flat().filter(r => !r.kids && finalName(r) && finalName(r) !== r.name).length;
  $('apply').textContent = changed ? `Áp dụng (${changed})` : 'Áp dụng';
  $('apply').disabled = !changed;
}
function pick(r, e) {
  const list = flat();
  if (e.shiftKey && state.last !== null) {
    const a = list.findIndex(x => x.id === state.last), b = list.findIndex(x => x.id === r.id);
    list.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => state.sel.add(x.id));
  } else if (e.ctrlKey || e.metaKey) {
    state.sel.has(r.id) ? state.sel.delete(r.id) : state.sel.add(r.id);
  } else { state.sel = new Set([r.id]); }
  state.last = r.id; render();
}
function targets() { return flat().filter(r => state.sel.has(r.id)).flatMap(r => r.kids ? r.kids : [r]); }
function useWord(word) {
  const list = targets();
  if (!list.length) return status('Hãy chọn dòng ở trên trước.');
  list.forEach(r => { const now = (r.newName || '').trim(); r.newName = now && !now.includes(word) ? `${now} ${word}` : word; });
  render(); status(`Đã ghép "${word}" vào tên mới của ${list.length} món. Chưa áp dụng.`);
}
function renderSets() {
  const host = $('sets'); host.replaceChildren();
  SETS.forEach(set => {
    const box = el('div', 'set');
    const title = el('div', 'set-title', set.title); title.append(el('span', 'cnt', String(set.items.length)));
    const list = el('div', 'set-list');
    set.items.forEach((word, i) => {
      const chip = el('div', 'chip'); chip.draggable = true; chip.title = 'Bấm để ghép vào tên mới của các dòng đang chọn; kéo để đổi chỗ';
      chip.append(el('span', 'txt', word));
      const x = el('button', 'x', '×'); x.type = 'button'; x.title = 'Xóa khỏi danh sách'; x.onclick = e => { e.stopPropagation(); set.items.splice(i, 1); renderSets(); };
      chip.append(x); chip.onclick = () => useWord(word); list.append(chip);
    });
    if (!set.items.length) list.append(el('div', 'set-empty', 'Chưa có tên nào'));
    const entry = el('div', 'entry');
    const add = el('button', '', '+'); add.type = 'button'; add.title = 'Thêm vào danh sách';
    const input = el('input'); input.placeholder = `Thêm ${set.title.toLowerCase()}...`; input.spellcheck = false;
    const keep = () => { const v = input.value.trim(); if (v && !set.items.includes(v)) { set.items.push(v); renderSets(); } };
    add.onclick = keep; input.onkeydown = e => { if (e.key === 'Enter') keep(); };
    entry.append(add, input);
    box.append(title, list, entry); host.append(box);
  });
}
function status(text) { $('status').textContent = text; }

$('upper').onclick = () => { state.upper = !state.upper; $('upper').setAttribute('aria-pressed', String(state.upper)); render(); };
$('numbered').onclick = () => { state.numbered = !state.numbered; $('numbered').setAttribute('aria-pressed', String(state.numbered)); render(); };
['find', 'repl'].forEach(id => { $(id).oninput = render; });
document.querySelectorAll('.vgd-switch').forEach(sw => { sw.onclick = () => { sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true')); render(); }; });
$('apply').onclick = () => status('(Bản mẫu) Bấm Áp dụng sẽ đổi tên các món trong SketchUp, một bước hoàn tác.');
// Kéo thanh chia để đổi chiều cao vùng danh sách tên ở dưới.
$('split').onmousedown = e => {
  e.preventDefault(); document.body.classList.add('resizing');
  const sets = $('sets'), start = e.clientY, h0 = sets.offsetHeight;
  const move = ev => { sets.style.height = Math.max(90, Math.min(window.innerHeight - 220, h0 - (ev.clientY - start))) + 'px'; };
  const up = () => { document.body.classList.remove('resizing'); removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
};
if (window.VGDTheme) VGDTheme.start({key: 'vgd.bim.theme', button: $('theme')});
renderSets(); render();
</script>
</body>
</html>
