<!doctype html>
<!-- Cửa sổ Đổi tên độc lập của VGD BIM (ui/rename_window.rb). Danh sách là các group / component đang chọn trong SketchUp.
     Tên mới = tiền tố + tên + hậu tố, bấm các mẫu tên ở dưới hoặc nhấp đúp để gõ tay. Logic giao diện: rename.js. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VGD BIM · Đổi tên</title>
<link rel="stylesheet" href="vgd-theme/vgd-theme.css">
<link rel="stylesheet" href="vgd-theme/vgd-controls.css">
<link rel="stylesheet" href="rename.css">
</head>
<body class="vgd-ui">
  <div class="rn-top">
    <span class="rn-title">Đổi tên</span>
    <span class="rn-scope" id="scope"></span>
    <button class="rn-icon" id="theme" type="button" aria-label="Đổi giao diện sáng / tối" title="Đổi giao diện sáng / tối"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>

  <div class="rn-list">
    <div class="rn-head">
      <span class="c-id">#</span>
      <span class="c-name" id="sort-by-name" title="Bấm để xếp theo tên hiện tại">Tên hiện tại <span class="sort" id="sort-name"></span></span>
      <span class="c-new"><span id="sort-by-new" title="Bấm để xếp theo tên mới">Tên mới <span class="sort" id="sort-new"></span></span>
        <span class="hbtns">
          <button class="hbtn" id="reset" type="button" title="Bỏ tên mới chưa áp dụng của các dòng đang chọn (chưa chọn dòng nào thì bỏ hết)">↺</button>
          <button class="hbtn" id="upper" type="button" aria-pressed="false" title="Viết CHỮ HOA cho tên mới">AA</button>
          <button class="hbtn" id="numbered" type="button" aria-pressed="true" title="Thêm số thứ tự vào cuối tên mới (01, 02...) khi nhiều món cùng tên mới">123</button>
        </span>
      </span>
    </div>
    <div class="rn-scroll" id="rows"></div>
    <div class="rn-foot">
      <div class="swap">
        <input id="find" type="text" placeholder="Thay" spellcheck="false" autocomplete="off" maxlength="100" aria-label="Chữ cần thay">
        <span class="arrow">→</span>
        <input id="repl" type="text" placeholder="Bằng" spellcheck="false" autocomplete="off" maxlength="100" aria-label="Thay bằng">
      </div>
      <div class="auto">
        <span class="auto-title">Tự động:</span>
        <span class="vgd-switch-item" title="Đổi tên xong thì ẩn các món đó trong SketchUp để không đặt nhầm lần nữa (Edit > Unhide để hiện lại)"><button class="vgd-switch" id="auto-hide" type="button" role="switch" aria-checked="false" aria-label="Ẩn món đã đổi tên"></button><span class="vgd-switch-label">Ẩn</span></span>
      </div>
      <button class="apply" id="apply" type="button" disabled>Áp dụng</button>
    </div>
  </div>

  <div class="rn-split" id="split" title="Kéo để đổi chiều cao"></div>

  <div class="rn-sets" id="sets"></div>
  <div class="rn-status" id="status" role="status" aria-live="polite">Bấm một mẫu ở dưới để đặt tiền tố, tên, hậu tố cho các dòng đang chọn (chưa chọn dòng nào thì cho mọi dòng). Nhấp đúp ô Tên mới để gõ tay.</div>

<script src="vgd-theme/vgd-theme.js"></script>
<script src="i18n.js"></script>
<script src="rename.js"></script>
</body>
</html>
