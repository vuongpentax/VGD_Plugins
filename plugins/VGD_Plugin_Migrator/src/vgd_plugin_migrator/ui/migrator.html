<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<link rel="stylesheet" href="vgd-theme/vgd-theme.css"><link rel="stylesheet" href="dialog.css">
</head><body class="vgd-ui">
<header>
  <div class="brand"><div class="wordmark">VGD</div><h1 id="title">Chuyển plugin</h1><div class="ver" id="ver"></div></div>
  <button class="vgd-theme-btn" id="themeButton" type="button"></button>
</header>
<div class="box" id="list"></div>
<div class="bar">
  <button onclick="setAll(true)">Chọn hết</button>
  <button onclick="setAll(false)">Bỏ chọn hết</button>
</div>
<div class="opts">
  <label><input type="checkbox" id="overwrite"> Ghi đè nếu plugin đã tồn tại ở bản đích</label>
  <label><input type="checkbox" id="shortcuts" checked> Phím tắt (khi chuyển hoặc kèm trong gói)</label>
  <label><input type="checkbox" id="toolbars"> Giao diện thanh công cụ (khi chuyển hoặc kèm trong gói)</label>
</div>
<div class="bar">
  <button class="primary" id="goBtn" onclick="go()">Chuyển</button>
  <button onclick="exportBundle()">Xuất gói .rbz tổng</button>
</div>
<div id="out"></div>
<script src="vgd-theme/vgd-theme.js"></script>
<script>
function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; }
function init(d) {
  document.getElementById('title').textContent = 'Chuyển từ SketchUp ' + d.src + ' sang ' + d.dst;
  document.getElementById('ver').textContent = 'VGD Plugin Migrator ' + d.version;
  document.getElementById('goBtn').textContent = 'Chuyển sang bản ' + d.dst;
  var L = document.getElementById('list'); L.innerHTML = '';
  d.plugins.forEach(function (name, i) {
    var r = el('label', 'row'), cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'pl'; cb.value = name; cb.checked = true;
    r.appendChild(cb); r.appendChild(el('span', '', (i + 1) + '. ' + name)); L.appendChild(r);
  });
}
function setAll(v) { document.querySelectorAll('.pl').forEach(function (c) { c.checked = v; }); }
function collect() {
  var p = [].slice.call(document.querySelectorAll('.pl')).filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
  return { plugins: p, overwrite: document.getElementById('overwrite').checked,
           shortcuts: document.getElementById('shortcuts').checked, toolbars: document.getElementById('toolbars').checked };
}
function go() { sketchup.migrate(JSON.stringify(collect())); }
function exportBundle() { sketchup.export_bundle(JSON.stringify(collect())); }
function showResult(t) { var e = document.getElementById('out'); e.style.display = 'block'; e.textContent = t; }
VGDTheme.start({ key: 'vgd.plugin_migrator.theme', button: document.getElementById('themeButton') });
window.onload = function () { sketchup.mg_ready(); };
</script></body></html>
