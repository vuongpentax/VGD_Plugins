<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>VGD Map seamless</title><link rel="stylesheet" href="dialog.css"><style>
body{overflow:hidden}header{min-height:58px;height:58px}.seam-controls{display:flex;gap:12px;align-items:center;padding:14px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.seam-controls label{font-size:10px;color:var(--muted)}.seam-controls input[type=range]{width:100px;vertical-align:middle;padding:0}.seam-controls select{max-width:190px}.stage{display:flex;flex:1;gap:20px;padding:20px;min-height:0}.pane{flex:1;background:white;border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;overflow:hidden}.pane h2{font-size:12px;font-weight:500;padding:10px 15px;margin:0;border-bottom:1px solid var(--line)}.pane h2 span{float:right;color:var(--muted)}.tiles{flex:1;background-size:33.333% 33.333%;background-repeat:repeat;background-color:#e8e6df;min-height:120px}.seam-footer{padding:0 20px 14px;display:flex;gap:8px;align-items:center;font-size:10px}.seam-footer p{flex:1;color:var(--muted)}#busy{color:var(--accent)}#seamStatus{padding:8px 20px;min-height:30px;font-size:11px}#seamStatus.error{color:#ad453c}
</style></head><body>
<header><div class="brand"><span class="mark">V</span><div>VGD<span class="brand-sub">MAP SEAMLESS</span></div></div><span class="subtitle">Xem trước ảnh trải 3 × 3 ô</span></header>
<div class="seam-controls"><select id="material" aria-label="Vật liệu"></select><label>Mức độ <select id="preset"><option value="light">Nhẹ</option><option value="medium" selected>Vừa</option><option value="strong">Mạnh</option></select></label><label>Khử loang sáng <input id="flatten" type="range" min="0" max="100" value="50"><output id="flattenValue">50%</output></label><label>Hòa viền <input id="feather" type="range" min="0" max="15" value="4"><output id="featherValue">4%</output></label><label>Cạnh ảnh tối đa <select id="resolution"><option>256</option><option>512</option><option selected>1024</option><option>2048</option></select></label><label><input id="autoskip" type="checkbox" checked> Giữ ảnh đã liền</label><button id="preview">Xem trước</button><span id="busy"></span></div>
<div class="stage"><div class="pane"><h2>Map hiện tại <span id="beforeError"></span></h2><div id="before" class="tiles"></div></div><div class="pane"><h2>Map seamless <span id="afterError"></span></h2><div id="after" class="tiles"></div></div></div>
<div id="seamStatus" role="status" aria-live="polite">Đang đọc vật liệu…</div><div class="seam-footer"><p>Độ lệch viền càng thấp càng liền mạch. Bản VGD dùng khử loang sáng và cân bằng viền ảnh; có thể làm thay đổi vân.</p><button id="all">Áp dụng tất cả</button><button id="apply" class="primary">Áp dụng vật liệu này</button><button id="close">Đóng</button></div>
<script src="seamless.js"></script></body></html>
